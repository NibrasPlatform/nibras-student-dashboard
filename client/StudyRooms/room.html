<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nibras - Study Room</title>
    <script src="../services/auth-guard.js" data-login="../Login/loginPage/login.html" data-api="https://nibras-backend.up.railway.app/api"></script>
    <script>
    (function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./rooms.css">
    <style>
        .room-page-wrapper { padding: 1rem; max-width: 1400px; margin: 0 auto; width: 100%; height: calc(100vh - 2rem); display: flex; flex-direction: column; }
        .room-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; flex-shrink: 0; }
        .room-header h1 { font-size: 1.2rem; font-weight: 600; }
        .room-header .room-meta { font-size: 0.85rem; color: var(--text-secondary); }

        .room-layout { display: flex; flex: 1; gap: 1rem; min-height: 0; }
        .video-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .video-grid {
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.5rem; overflow-y: auto; padding: 0.25rem; align-content: start;
        }
        .video-container {
            position: relative; background-color: var(--tag-bg); border-radius: 10px;
            overflow: hidden; aspect-ratio: 16/10; display: flex; align-items: center;
            justify-content: center; border: 2px solid var(--border-color); min-height: 180px;
        }
        .video-container.muted { border-color: var(--accent-red); }
        .video-container.speaking { border-color: var(--accent-green); }
        .video-container video { width: 100%; height: 100%; object-fit: cover; }
        .video-container.local video { transform: scaleX(-1); }
        .video-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 0.4rem 0.6rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.6)); display: flex;
            justify-content: space-between; align-items: center;
        }
        .video-overlay-name { font-size: 0.8rem; font-weight: 500; color: white; }
        .video-overlay-icons { display: flex; gap: 0.35rem; color: white; font-size: 0.75rem; }
        .video-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.5rem; color: var(--text-tertiary);
        }
        .video-placeholder .avatar-large {
            width: 60px; height: 60px; border-radius: 50%; background-color: var(--accent-blue);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 600;
        }
        .video-placeholder .name { font-size: 0.9rem; font-weight: 500; color: var(--text-primary); }

        .local-preview {
            position: absolute; bottom: 1rem; right: 1rem; width: 160px; height: 100px;
            border-radius: 8px; overflow: hidden; border: 2px solid var(--border-color);
            background-color: var(--tag-bg); z-index: 5; cursor: pointer;
        }
        .local-preview video { width: 100%; height: 100%; object-fit: cover; }

        .participants-sidebar {
            width: 240px; flex-shrink: 0; background-color: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 12px; display: flex;
            flex-direction: column; overflow: hidden;
        }
        .participants-sidebar h3 {
            font-size: 0.85rem; font-weight: 600; padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .participants-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .participant-item {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem;
            border-radius: 6px; font-size: 0.85rem;
        }
        .participant-item:hover { background-color: var(--tag-bg); }
        .participant-item .dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        .participant-item .dot.online { background-color: var(--accent-green); }
        .participant-item .dot.speaking { background-color: var(--accent-green); box-shadow: 0 0 4px var(--accent-green); }
        .participant-item .dot.muted { background-color: var(--accent-red); }
        .participant-item .name { flex: 1; }
        .participant-item .status-icon { font-size: 0.75rem; color: var(--text-tertiary); }

        .controls-bar {
            display: flex; justify-content: center; align-items: center; gap: 0.75rem;
            padding: 0.75rem; background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; margin-top: 0.75rem; flex-shrink: 0;
        }
        .controls-bar .btn {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1rem; padding: 0; border: none;
        }
        .controls-bar .btn.btn-danger-bg { background-color: var(--accent-red); color: white; }
        .controls-bar .btn.btn-active { background-color: var(--accent-blue); color: white; }
        .controls-bar .btn.btn-inactive { background-color: var(--tag-bg); color: var(--text-secondary); }
        .controls-bar .btn.btn-inactive:hover { background-color: var(--border-color); }
        .controls-bar .btn.recording { background-color: var(--accent-red); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        .controls-bar .btn.leave-btn { width: auto; padding: 0 1rem; border-radius: 24px; background-color: var(--accent-red); color: white; font-size: 0.85rem; gap: 0.35rem; }

        .recording-timer {
            font-size: 0.8rem; color: var(--accent-red); display: flex; align-items: center;
            gap: 0.3rem; font-weight: 500;
        }

        @media (max-width: 768px) {
            .room-layout { flex-direction: column; }
            .participants-sidebar { width: 100%; max-height: 150px; }
            .video-grid { grid-template-columns: 1fr; }
            .local-preview { width: 100px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="app-root" hidden></div>

    <main class="main-content" style="margin-left:0;">
        <div class="room-page-wrapper">
            <div class="room-header">
                <div>
                    <h1 id="room-name-display">Study Room</h1>
                    <span id="room-meta-display" class="room-meta"></span>
                </div>
                <a href="./rooms.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> All Rooms</a>
            </div>

            <div class="room-layout">
                <div class="video-area">
                    <div class="video-grid" id="video-grid">
                        <div class="empty-state" id="loading-video">
                            <div class="empty-state-icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
                            <h3>Connecting to room...</h3>
                        </div>
                    </div>

                    <div class="controls-bar" id="controls-bar">
                        <button id="btn-mic" class="btn btn-active" title="Toggle Microphone"><i class="fa-solid fa-microphone"></i></button>
                        <button id="btn-camera" class="btn btn-active" title="Toggle Camera"><i class="fa-solid fa-video"></i></button>
                        <button id="btn-screen-share" class="btn btn-inactive" title="Share Screen"><i class="fa-solid fa-desktop"></i></button>
                        <button id="btn-record" class="btn btn-inactive" title="Record"><i class="fa-solid fa-circle"></i></button>
                        <span id="recording-timer" class="recording-timer" style="display:none;"><i class="fa-solid fa-circle" style="font-size:0.6rem;"></i> <span id="recording-time">00:00</span></span>
                        <button id="btn-leave" class="btn leave-btn"><i class="fa-solid fa-phone-slash"></i> Leave</button>
                    </div>
                </div>

                <div class="participants-sidebar">
                    <h3><i class="fa-solid fa-users"></i> <span id="participant-count">0</span> Participants</h3>
                    <div class="participants-list" id="participants-list">
                        <div style="padding:1rem;text-align:center;color:var(--text-tertiary);font-size:0.85rem;">Connecting...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../react-page-utils.js"></script>
    <script src="../react-bootstrap.js"></script>
    <script src="./room.js?v=1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Builder</title>
    <script src="../../services/auth-guard.js" data-login="../../Login/loginPage/login.html" data-api="https://nibras-backend.up.railway.app/api"></script>
    <script>
    (function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./project-builder.css">
</head>
<body>
    <div id="app-root" hidden></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Course Content</h2>
        </div>

        <ul class="nav-menu">
            <li class="nav-item"><a href="../../Courses/Course%20Description/courseContent.html" class="nav-link" data-nav-link="courseContent"><i class="fa-solid fa-book-open"></i> Course Overview</a></li>
            <li class="nav-item"><a href="../AssignmentBuilder/assignment-builder.html" class="nav-link" data-nav-link="assignments"><i class="fa-regular fa-file-lines"></i> Assignments</a></li>
            <li class="nav-item"><a href="./project-builder.html" class="nav-link active" data-nav-link="projectBuilder"><i class="fa-solid fa-diagram-project"></i> Project Builder</a></li>
            <li class="nav-item"><a href="../ProjectGrading/project-grading.html" class="nav-link" data-nav-link="projectGrading"><i class="fa-solid fa-check-double"></i> Project Grading</a></li>
            <li class="nav-item"><a href="../Grading/grading.html" class="nav-link" data-nav-link="grading"><i class="fa-solid fa-check-double"></i> Grading</a></li>
            <li class="nav-item"><a href="../InstructorGrades/instructor-grades.html" class="nav-link" data-nav-link="grades"><i class="fa-solid fa-award"></i> Grades</a></li>
        </ul>

        <div class="sidebar-footer">
            <a href="../../Courses/courses.html" class="back-btn">
                <i class="fa-solid fa-arrow-left-long" style="margin-right:8px"></i> Return to Courses
            </a>
            <div class="course-meta">
                <h4 id="sidebar-course-code">Loading course...</h4>
                <span id="sidebar-term">Loading...</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="top-bar">
            <div class="breadcrumbs">
                <span class="crumb-current">Projects</span>
            </div>
            <button class="theme-toggle-btn" id="themeBtn"><i class="fa-solid fa-sun"></i> <span>Light Mode</span></button>
        </div>

        <div class="page-header">
            <div class="header-row">
                <div>
                    <h1>Project Builder</h1>
                    <p id="course-subtitle">Loading course...</p>
                </div>
                <button id="btn-create-project" class="primary-btn"><i class="fa-solid fa-plus"></i> Create Project</button>
            </div>
        </div>

        <!-- Project List -->
        <div id="project-list" class="project-list">
            <p style="text-align:center;padding:48px 16px;color:var(--text-secondary)">Loading projects...</p>
        </div>
    </main>

    <!-- Project Form Modal -->
    <div id="project-modal" class="modal-overlay" style="display:none">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Create Project</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-project-id">

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="field-title" class="form-input" placeholder="e.g. Capstone Project">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="field-desc" class="form-input" rows="3" placeholder="Describe the project..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="field-due-date" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Due Time</label>
                        <input type="time" id="field-due-time" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Total Points</label>
                        <input type="number" id="field-points" class="form-input" value="100" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>GitHub Repository (optional)</label>
                    <input type="text" id="field-repo" class="form-input" placeholder="e.g. https://github.com/org/repo">
                </div>

                <div class="form-group">
                    <label>Team Size (0 for individual)</label>
                    <input type="number" id="field-team-size" class="form-input" value="3" min="0" max="20">
                </div>

                <!-- Milestones -->
                <div class="section-divider">
                    <h3><i class="fa-solid fa-flag-checkered"></i> Milestones</h3>
                    <button id="btn-add-milestone" class="secondary-btn"><i class="fa-solid fa-plus"></i> Add Milestone</button>
                </div>
                <div id="milestones-container" class="milestones-container"></div>

                <div id="form-status" class="form-status"></div>
            </div>

            <div class="modal-footer">
                <button id="btn-cancel" class="secondary-btn">Cancel</button>
                <button id="btn-save" class="primary-btn"><i class="fa-solid fa-floppy-disk"></i> Save Project</button>
            </div>
        </div>
    </div>

    <script src="../../react-bootstrap.js"></script>
    <script src="../../Courses/courseData.js"></script>
    <script src="../../services/api.js"></script>
    <script src="./project-builder.js"></script>
</body>
</html>
